[package]
name = "fastcrypto-pq"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["Mysten Labs <build@mystenlabs.com>"]
readme = "../README.md"
description = "Post-quantum signature schemes"
repository = "https://github.com/MystenLabs/fastcrypto"
publish = false

[dependencies]
# copy_key is not optional here: fastcrypto-cli enables fastcrypto/copy_key in every
# whole-workspace build, which adds copy() to the KeyPair trait; enabling it here
# unconditionally keeps the trait impl valid in standalone and workspace builds alike.
fastcrypto = { path = "../fastcrypto", features = ["copy_key"] }
fastcrypto-derive = { path = "../fastcrypto-derive", version = "0.1.4" }
# TODO: The C backend (mldsa-native, pinned as a submodule inside the wrapper) and the unsafe FFI
# surface live behind this crate. A local path while the wrapper repo is under internal
# review; once it is published, switch to the exact-commit git pin (consensus-critical), e.g.
# mysten-mldsa-native-rs = { git = "https://github.com/MystenLabs/mysten-mldsa-native-rs.git", rev = "c46c89c57b7554d6d17bd280a8015c222c09024f" }
# Cargo fetches the wrapper's submodule automatically for git dependencies, so no submodule
# handling will be needed in this repo or its CI.
mysten-mldsa-native-rs = { path = "../../mysten-mldsa-native-rs" }
rand.workspace = true
serde.workspace = true
bincode.workspace = true

[features]
# Forwards to the wrapper's verified assembly backends: NEON on aarch64, AVX2 on x86_64
# behind a runtime CPU probe. Identical signatures either way, roughly 2.5x faster.
native = ["mysten-mldsa-native-rs/native"]

[dev-dependencies]
bcs.workspace = true
bincode.workspace = true
criterion = "0.5.1"
rand.workspace = true
serde_json = "1.0.93"

[[bench]]
name = "mldsa65"
harness = false
