[package]
name = "fastcrypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
# Independent BLS12-381 implementation, used as an oracle for decoding.
ark-bls12-381 = "0.4.0"
ark-ec = "0.4.1"
ark-serialize = "0.4.1"
bcs = "0.1.4"
bincode = "1.3.3"
curve25519-dalek = "4.1.3"
# Used with p256 as an oracle for secp256r1 public key recovery.
ecdsa = { version = "0.16.9", features = ["verifying"] }
fastcrypto = { path = "../fastcrypto", features = ["experimental"] }
hex-literal = "0.4.1"
libfuzzer-sys = "0.4"
once_cell = "1.17.0"
# Independent P-256 ECDSA implementation, used as an oracle for decoding and verification.
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8.5"
serde = "1.0.152"
serde_json = "1.0.93"
sha2 = "0.10"

# Not a member of the main workspace: cargo-fuzz needs a nightly toolchain and its own build flags.
[workspace]
members = ["."]

[[bin]]
name = "bls12381_deserialize"
path = "fuzz_targets/bls12381_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bls12381_verify"
path = "fuzz_targets/bls12381_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bls12381_batch_verify"
path = "fuzz_targets/bls12381_batch_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ed25519_deserialize"
path = "fuzz_targets/ed25519_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ed25519_verify"
path = "fuzz_targets/ed25519_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ed25519_batch_verify"
path = "fuzz_targets/ed25519_batch_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bls12381_group_deserialize"
path = "fuzz_targets/bls12381_group_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bls12381_group_ops"
path = "fuzz_targets/bls12381_group_ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secp256r1_deserialize"
path = "fuzz_targets/secp256r1_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secp256r1_verify"
path = "fuzz_targets/secp256r1_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secp256r1_ecrecover"
path = "fuzz_targets/secp256r1_ecrecover.rs"
test = false
doc = false
bench = false
