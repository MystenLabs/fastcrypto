[package]
name = "fastcrypto-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
# Independent BLS12-381 implementation, used as an oracle for decoding.
ark-bls12-381 = "0.4.0"
ark-ec = "0.4.1"
# arkworks P-256 field elements, to compare p256 results with fastcrypto secp256r1 points, and the
# field arithmetic of the ristretto255 reference.
ark-ff = "0.4.2"
ark-secp256r1 = "0.4.0"
ark-serialize = "0.4.1"
bcs = "0.1.4"
bincode = "1.3.3"
curve25519-dalek = "4.1.3"
# Used with p256 as an oracle for secp256r1 public key recovery.
ecdsa = { version = "0.16.9", features = ["verifying"] }
fastcrypto = { path = "../fastcrypto", features = ["experimental"] }
hex-literal = "0.4.1"
# k256 is an independent secp256k1 implementation that the secp256k1 targets compare with. Same
# version as the dev-dependency of fastcrypto: unlike later versions, its recovery accepts high-s
# signatures, like fastcrypto and Ethereum.
k256 = { version = "0.11.6", features = ["ecdsa", "keccak256", "sha256"] }
libfuzzer-sys = "0.4"
once_cell = "1.17.0"
# Independent P-256 ECDSA implementation, used as an oracle for decoding and verification.
p256 = { version = "0.13.2", features = ["ecdsa"] }
rand = "0.8.5"
# libsecp256k1, used as an oracle for BIP-340. Unlike rust-secp256k1 0.27, which fastcrypto's ECDSA
# uses, this version doesn't replace its cryptography with mocks under cfg(fuzzing).
secp256k1 = "0.31.1"
serde = "1.0.152"
serde_json = "1.0.93"
sha2 = "0.10"

# Not a member of the main workspace: cargo-fuzz needs a nightly toolchain and its own build flags.
[workspace]
members = ["."]

[[bin]]
name = "bls12381_deserialize"
path = "fuzz_targets/bls12381_deserialize.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bls12381_verify"
path = "fuzz_targets/bls12381_verify.rs"
test = false
doc = false
bench = false

[[bin]]
name = "bls12381_batch_verify"
