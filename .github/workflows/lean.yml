name: Lean models

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUSTUP_MAX_RETRIES: 10
  RUST_BACKTRACE: short
  PROPTEST_CASES: 32

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-ghcloud
    strategy:
      matrix:
        directory:
          - fastcrypto-tbls/src/polynomial/lean/harness
          - fastcrypto/src/groups/lean/harness
          - fastcrypto/src/bulletproofspp/lean/harness
      fail-fast: false
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # pin@v3
      - uses: actions-rs/toolchain@16499b5e05bf2e26879000db0c1d13f7e13fa3af # pin@v1
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain "$(cat fastcrypto-tbls/src/polynomial/lean/model/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compare the Rust code with its Lean model
        working-directory: ${{ matrix.directory }}
        run: cargo test --release

  specs:
    runs-on: ubuntu-ghcloud
    steps:
      - uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # pin@v3
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Check the Shamir proofs
        working-directory: fastcrypto-tbls/src/polynomial/lean/specs
        run: |
          lake exe cache get
          lake build
