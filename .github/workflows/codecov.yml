name: Codecov

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  coverage:
    name: Collect test coverage
    # Not ubuntu-latest: on ubuntu-26.04, mysten-mldsa-native-rs 0.2.0 fails to build because the C
    # compiler enables AVX2 by default, which its x86-64 build rejects.
    runs-on: ubuntu-24.04
    # nightly rust might break from time to time
    continue-on-error: true
    env:
      RUSTFLAGS: -D warnings
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v3
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Collect coverage data
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info -- --skip zk_login_e2e
      - name: Upload coverage data to codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
