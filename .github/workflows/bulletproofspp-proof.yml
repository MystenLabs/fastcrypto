# THIS FILE IS AI-ONLY
name: Bulletproofs++ Lean Proof

# Checks the Lean proofs in `fastcrypto/verification/bulletproofspp` against the current Rust code,
# with `lean-proof.yml`.

on:
  pull_request:
    paths:
      - fastcrypto/src/bulletproofspp/**
      - fastcrypto/src/groups/**
      - fastcrypto/src/pedersen.rs
      - fastcrypto/src/serde_helpers.rs
      - fastcrypto/src/error.rs
      - fastcrypto/verification/**
      - fastcrypto/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/bulletproofspp-proof.yml
      - .github/workflows/lean-proof.yml
  push:
    branches: [main]
    paths:
      - fastcrypto/src/bulletproofspp/**
      - fastcrypto/src/groups/**
      - fastcrypto/src/pedersen.rs
      - fastcrypto/src/serde_helpers.rs
      - fastcrypto/src/error.rs
      - fastcrypto/verification/**
      - fastcrypto/Cargo.toml
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/bulletproofspp-proof.yml
      - .github/workflows/lean-proof.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  proof:
    uses: ./.github/workflows/lean-proof.yml
    with:
      proof_dir: fastcrypto/verification
      module: bulletproofspp
      theorems: >-
        BpppProofs.RangeProof.completeness_rust
        BpppProofs.RangeProof.verify_batch_refines
        BpppProofs.RangeProof.prove_batch_refines
        BpppProofs.RangeProof.prove_batch_distribution
        BpppProofs.RangeProof.zero_knowledge_rust
        Bppp.RangeProof.completeness
        Bppp.RangeProof.verify_extract
        Bppp.RangeProof.zero_knowledge
        Bppp.RangeProof.verify_batch_local
        Bppp.RangeProof.challenge_decodes
        Bppp.RangeProof.challengeLogs_nodup
