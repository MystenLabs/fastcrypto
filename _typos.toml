# Configuration for the `typos` spell checker (https://github.com/crate-ci/typos).

[files]
extend-exclude = [
    # Test vectors and data files.
    "*.json",
    "fastcrypto-threshold/src/weight_reduction/data/",
]

[default]
extend-ignore-re = [
    # Long base64 / base64url / hex strings (keys, proofs, JWTs, test vectors).
    "[A-Za-z0-9+/_=-]{40,}",
    # RFC 4648 test vectors ("f", "fo", "foo", ...).
    '"fo"',
    # Author name (Maitin-Shepard).
    'Maitin-Shepard',
]

[default.extend-words]
# Cryptography terms and names.
groth = "groth"     # Groth16
cose = "cose"       # CBOR Object Signing and Encryption
hashi = "hashi"
# Short variable names.
nd = "nd"
ot = "ot"
